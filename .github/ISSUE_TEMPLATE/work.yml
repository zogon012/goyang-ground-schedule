name: 작업 이슈
description: 기능, 수정, 문서 작업을 시작하기 위한 이슈입니다.
title: ""
labels: []
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결하려는 문제 또는 달성할 결과를 간략히 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 작업과 제외할 작업을 간략히 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 작업이 완료되었다고 판단할 수 있는 조건을 작성합니다.
    validations:
      required: true
