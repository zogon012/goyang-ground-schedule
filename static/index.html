<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 축구장 예약 현황</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --line: #e4e7ec;
            --surface: #ffffff;
            --page: #f7f8fa;
            --primary: #216e4e;
            --primary-soft: #e8f3ed;
            --warning: #9a6700;
            --danger: #b42318;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }
        .container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
        header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 28px; }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(1.7rem, 4vw, 2.35rem); letter-spacing: -0.04em; }
        h2 { font-size: 1.15rem; }
        .subtitle { color: var(--muted); margin-top: 6px; }
        .refresh-button {
            flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
            color: var(--ink); cursor: pointer; font: inherit; padding: 10px 14px;
        }
        .refresh-button:hover { border-color: var(--primary); color: var(--primary); }
        .refresh-button:disabled { color: var(--muted); cursor: wait; }
        .status-bar {
            display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 20px;
            color: var(--muted); font-size: 0.875rem;
        }
        .status { color: var(--primary); font-weight: 600; }
        .status.warning { color: var(--warning); }
        .status.error { color: var(--danger); }
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; }
        .panel-heading { border-bottom: 1px solid var(--line); padding: 18px 20px; }
        .availability { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--line); }
        .availability-row { background: var(--surface); padding: 15px 20px; }
        .availability-time { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
        .availability-fields { color: var(--ink); font-weight: 600; margin-top: 4px; }
        .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
        .field-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .field-card h3 { padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 1rem; }
        .section { padding: 14px 18px; }
        .section + .section { border-top: 1px solid var(--line); }
        .section-title { color: var(--muted); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
        .entry { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 0.92rem; }
        .entry + .entry { border-top: 1px solid #f0f1f3; }
        .entry-time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .empty { color: var(--muted); font-size: 0.92rem; }
        .message { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); padding: 32px 20px; text-align: center; }
        [hidden] { display: none; }
        @media (max-width: 620px) {
            .container { width: min(100% - 24px, 1120px); padding-top: 24px; }
            header { align-items: stretch; flex-direction: column; }
            .refresh-button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <div>
                <h1>축구장 예약 현황</h1>
                <p class="subtitle" id="date-info">데이터를 확인하는 중입니다.</p>
            </div>
            <button class="refresh-button" id="refresh-button" type="button">최신 정보 확인</button>
        </header>

        <div class="status-bar" aria-live="polite">
            <span class="status" id="status">수집 데이터 대기 중</span>
            <span id="updated-at"></span>
            <span id="next-refresh"></span>
        </div>

        <div class="message" id="message">저장된 예약 정보를 불러오는 중입니다.</div>
        <section id="content" hidden>
            <section class="panel">
                <div class="panel-heading"><h2>시간대별 빈 구장</h2></div>
                <div class="availability" id="availability"></div>
            </section>
            <section class="field-grid" id="field-grid"></section>
        </section>
    </main>

    <script>
        const message = document.getElementById('message');
        const content = document.getElementById('content');
        const refreshButton = document.getElementById('refresh-button');
        let isLoading = false;

        function formatDateTime(value) {
            if (!value) return '수집 시각 없음';
            return new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit'
            }).format(new Date(value));
        }

        function setStatus(text, type = 'normal') {
            const element = document.getElementById('status');
            element.textContent = text;
            element.className = `status ${type === 'normal' ? '' : type}`;
        }

        function addEntry(parent, left, right) {
            const entry = document.createElement('div');
            entry.className = 'entry';
            const label = document.createElement('span');
            label.textContent = left;
            const value = document.createElement('span');
            value.className = 'entry-time';
            value.textContent = right;
            entry.append(label, value);
            parent.appendChild(entry);
        }

        function renderAvailability(fields) {
            const container = document.getElementById('availability');
            container.replaceChildren();
            for (let hour = 7; hour < 23; hour += 1) {
                const available = Object.entries(fields)
                    .filter(([, field]) => field.empty_slots.some((slot) => {
                        const start = Number(slot.start_time.slice(0, 2));
                        const end = Number(slot.end_time.slice(0, 2));
                        return start <= hour && end > hour;
                    }))
                    .map(([name]) => name);
                const row = document.createElement('div');
                row.className = 'availability-row';
                const time = document.createElement('div');
                time.className = 'availability-time';
                time.textContent = `${String(hour).padStart(2, '0')}:00 - ${String(hour + 1).padStart(2, '0')}:00`;
                const names = document.createElement('div');
                names.className = 'availability-fields';
                names.textContent = available.length ? available.join(', ') : '예약 가능한 구장 없음';
                row.append(time, names);
                container.appendChild(row);
            }
        }

        function renderFields(fields) {
            const grid = document.getElementById('field-grid');
            grid.replaceChildren();
            Object.entries(fields).forEach(([name, field]) => {
                const card = document.createElement('article');
                card.className = 'field-card';
                const title = document.createElement('h3');
                title.textContent = name;
                card.appendChild(title);

                const emptySection = document.createElement('div');
                emptySection.className = 'section';
                emptySection.innerHTML = '<div class="section-title">빈 시간</div>';
                if (field.empty_slots.length) {
                    field.empty_slots.forEach((slot) => addEntry(emptySection, '이용 가능', `${slot.start_time} - ${slot.end_time}`));
                } else {
                    emptySection.insertAdjacentHTML('beforeend', '<div class="empty">빈 시간이 없습니다.</div>');
                }

                const bookedSection = document.createElement('div');
                bookedSection.className = 'section';
                bookedSection.innerHTML = '<div class="section-title">예약</div>';
                if (field.booked_matches.length) {
                    field.booked_matches.forEach((match) => addEntry(bookedSection, match.team_name, `${match.start_time} - ${match.end_time}`));
                } else {
                    bookedSection.insertAdjacentHTML('beforeend', '<div class="empty">예약이 없습니다.</div>');
                }
                card.append(emptySection, bookedSection);
                grid.appendChild(card);
            });
        }

        function render(data) {
            const metadata = data.metadata;
            document.getElementById('date-info').textContent = `${data.date} ${data.weekday}요일 기준`;
            document.getElementById('updated-at').textContent = `마지막 수집: ${formatDateTime(metadata.fetched_at)}`;
            document.getElementById('next-refresh').textContent = metadata.next_refresh_at ? `다음 확인 예정: ${formatDateTime(metadata.next_refresh_at)}` : '';
            setStatus(metadata.is_stale ? '이전 수집 데이터 표시 중' : '최신 수집 데이터', metadata.is_stale ? 'warning' : 'normal');
            renderAvailability(data.fields);
            renderFields(data.fields);
            message.hidden = true;
            content.hidden = false;
        }

        async function loadData(showPending = true) {
            if (isLoading) return;
            isLoading = true;
            refreshButton.disabled = true;
            if (showPending && content.hidden) message.textContent = '저장된 예약 정보를 불러오는 중입니다.';
            try {
                const response = await fetch('/today');
                if (!response.ok) throw new Error('데이터 준비 중');
                render(await response.json());
            } catch (error) {
                if (content.hidden) {
                    message.hidden = false;
                    message.textContent = '수집된 데이터가 아직 없습니다. 잠시 후 다시 확인해 주세요.';
                }
                setStatus('데이터 확인 대기 중', 'warning');
            } finally {
                isLoading = false;
                refreshButton.disabled = false;
            }
        }

        refreshButton.addEventListener('click', () => loadData(false));
        loadData();
        window.setInterval(() => loadData(false), 60000);
    </script>
</body>
</html>
