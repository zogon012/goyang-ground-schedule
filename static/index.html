<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 축구장 예약 현황</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-focus: #0071e3;
            --primary-on-dark: #2997ff;
            --ink: #1d1d1f;
            --muted: #7a7a7a;
            --dark-muted: #cccccc;
            --canvas: #ffffff;
            --parchment: #f5f5f7;
            --pearl: #fafafc;
            --tile-dark: #272729;
            --black: #000000;
            --hairline: #e0e0e0;
            --divider: #f0f0f0;
        }

        * { box-sizing: border-box; }
        html { background: var(--parchment); }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--parchment);
            font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.374px;
            line-height: 1.47;
        }
        button { font: inherit; }
        .global-nav {
            height: 44px;
            display: flex;
            align-items: center;
            color: #ffffff;
            background: var(--black);
        }
        .nav-inner, .sub-nav-inner, .content-width { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: -0.12px; }
        .nav-start { display: flex; align-items: center; gap: 14px; }
        .nav-label { color: #ffffff; text-decoration: none; }
        .nav-meta { color: #cccccc; }
        .menu-button { display: grid; width: 32px; height: 32px; place-content: center; gap: 4px; padding: 0; color: #ffffff; background: transparent; border: 0; cursor: pointer; }
        .menu-button span { display: block; width: 14px; height: 1px; background: currentColor; }
        .menu-button:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 3px; }
        .sub-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 52px;
            display: flex;
            align-items: center;
            background: rgba(245, 245, 247, 0.82);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: saturate(180%) blur(20px);
        }
        .sub-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .sub-nav-title { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 0.231px; line-height: 1.19; }
        .refresh-button {
            min-height: 44px;
            padding: 11px 22px;
            color: #ffffff;
            background: var(--primary);
            border: 0;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 17px;
        }
        .refresh-button:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 3px; }
        .refresh-button:active { transform: scale(0.95); }
        .refresh-button:disabled { opacity: 0.55; cursor: wait; }
        .hero {
            min-height: 410px;
            display: grid;
            place-items: center;
            padding: 80px 20px;
            text-align: center;
            background: var(--canvas);
        }
        .hero-copy { max-width: 720px; }
        h1, h2, h3, p { margin: 0; }
        h1 {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-size: clamp(40px, 7vw, 56px);
            font-weight: 600;
            letter-spacing: -0.28px;
            line-height: 1.07;
        }
        .hero-date { margin-top: 16px; color: var(--ink); font-size: clamp(21px, 3vw, 28px); font-weight: 400; letter-spacing: 0.196px; line-height: 1.14; }
        .hero-summary { margin: 16px auto 0; color: var(--muted); max-width: 580px; }
        .status-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px 16px; margin-top: 28px; color: var(--muted); font-size: 14px; letter-spacing: -0.224px; }
        .status { color: var(--primary); font-weight: 600; }
        .status.warning { color: #9a6700; }
        .status.error { color: #b42318; }
        .tile { padding: 80px 0; }
        .tile-dark { color: #ffffff; background: var(--tile-dark); }
        .tile-parchment { background: var(--parchment); }
        .section-heading { max-width: 620px; margin: 0 auto 48px; text-align: center; }
        .section-heading h2 { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: clamp(34px, 5vw, 40px); font-weight: 600; letter-spacing: 0; line-height: 1.1; }
        .section-heading p { margin-top: 12px; color: var(--dark-muted); }
        .tile-parchment .section-heading p { color: var(--muted); }
        .availability { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid rgba(255, 255, 255, 0.24); border-left: 1px solid rgba(255, 255, 255, 0.24); }
        .availability-row { min-height: 150px; padding: 20px; border-right: 1px solid rgba(255, 255, 255, 0.24); border-bottom: 1px solid rgba(255, 255, 255, 0.24); scroll-margin-top: 76px; }
        .availability-row.current-time { outline: 2px solid var(--primary-on-dark); outline-offset: -2px; }
        .availability-row:focus-visible { outline: 2px solid #ffffff; outline-offset: -2px; }
        .availability-time { color: var(--dark-muted); font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: -0.224px; }
        .availability-fields { margin-top: 10px; font-size: 17px; font-weight: 600; line-height: 1.24; }
        .field-link { display: inline; padding: 0; color: var(--primary-on-dark); background: transparent; border: 0; cursor: pointer; font: inherit; font-weight: 600; text-align: left; }
        .field-link + .field-link::before { content: ", "; color: #ffffff; }
        .field-link:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; border-radius: 2px; }
        .current-label { display: block; margin-top: 7px; color: var(--primary-on-dark); font-size: 12px; font-weight: 600; letter-spacing: -0.12px; }
        .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .field-card { overflow: hidden; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; scroll-margin-top: 76px; }
        .field-card:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 4px; }
        .field-card h3 { padding: 24px 24px 18px; font-size: 21px; font-weight: 600; letter-spacing: 0.231px; line-height: 1.19; }
        .section { padding: 18px 24px 24px; border-top: 1px solid var(--divider); }
        .section-title { margin-bottom: 10px; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: -0.224px; line-height: 1.29; }
        .entry { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; letter-spacing: -0.224px; }
        .entry + .entry { border-top: 1px solid var(--divider); }
        .entry-time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .empty { color: var(--muted); font-size: 14px; }
        .message { width: min(980px, calc(100% - 40px)); margin: 0 auto; padding: 80px 20px; color: var(--muted); text-align: center; }
        .history-backdrop { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.32); }
        .history-menu { position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; width: min(380px, 100%); padding: 28px 24px; overflow-y: auto; color: var(--ink); background: var(--canvas); }
        .history-menu-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .history-menu h2 { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.28px; line-height: 1.14; }
        .close-button { min-width: 44px; min-height: 44px; padding: 0; color: var(--ink); background: var(--pearl); border: 1px solid var(--divider); border-radius: 9999px; cursor: pointer; }
        .history-menu p { margin-top: 12px; color: var(--muted); font-size: 14px; }
        .date-picker { width: 100%; height: 44px; margin-top: 28px; padding: 0 14px; color: var(--ink); background: var(--canvas); border: 1px solid var(--hairline); border-radius: 9999px; font: inherit; font-size: 14px; }
        .date-list { display: grid; gap: 8px; margin-top: 24px; }
        .date-button { min-height: 44px; padding: 10px 14px; color: var(--ink); background: var(--canvas); border: 1px solid var(--hairline); border-radius: 11px; cursor: pointer; font: inherit; font-size: 14px; text-align: left; }
        .date-button.selected { color: var(--primary); border: 2px solid var(--primary-focus); }
        .date-button:active { transform: scale(0.98); }
        .no-history { color: var(--muted); font-size: 14px; }
        footer { padding: 48px 0; color: var(--muted); background: var(--parchment); border-top: 1px solid var(--hairline); font-size: 12px; letter-spacing: -0.12px; }
        [hidden] { display: none; }
        @media (max-width: 1068px) { .availability { grid-template-columns: repeat(3, 1fr); } .field-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 734px) { .hero, .tile { padding-top: 48px; padding-bottom: 48px; } .availability { grid-template-columns: repeat(2, 1fr); } .section-heading { margin-bottom: 32px; } }
        @media (max-width: 480px) {
            .nav-inner, .sub-nav-inner, .content-width { width: min(100% - 24px, 980px); }
            .nav-meta { display: none; }
            .sub-nav-title { font-size: 17px; }
            .refresh-button { padding: 9px 16px; font-size: 14px; }
            .hero { min-height: 360px; }
            .availability, .field-grid { grid-template-columns: 1fr; }
            .availability-row { min-height: auto; }
        }
    </style>
</head>
<body>
    <nav class="global-nav" aria-label="전역 메뉴">
        <div class="nav-inner">
            <div class="nav-start">
                <button class="menu-button" id="menu-button" type="button" aria-controls="history-menu" aria-expanded="false" aria-label="날짜 메뉴 열기"><span></span><span></span><span></span></button>
                <a class="nav-label" href="/">고양시 생활체육</a>
            </div>
            <span class="nav-meta">예약 정보</span>
        </div>
    </nav>
    <nav class="sub-nav" aria-label="예약 현황 메뉴">
        <div class="sub-nav-inner">
            <span class="sub-nav-title">축구장 예약 현황</span>
            <button class="refresh-button" id="refresh-button" type="button">최신 정보 확인</button>
        </div>
    </nav>

    <main>
        <section class="hero" aria-labelledby="page-title">
            <div class="hero-copy">
                <h1 id="page-title">오늘, 이용 가능한 구장</h1>
                <p class="hero-date" id="date-info">데이터를 확인하는 중입니다.</p>
                <p class="hero-summary" id="hero-summary">저장된 최신 예약 정보를 표시합니다.</p>
                <div class="status-row" aria-live="polite">
                    <span class="status" id="status">수집 데이터 대기 중</span>
                    <span id="updated-at"></span>
                    <span id="next-refresh"></span>
                </div>
            </div>
        </section>

        <div class="message" id="message">저장된 예약 정보를 불러오는 중입니다.</div>
        <div id="content" hidden>
            <section class="tile tile-dark" aria-labelledby="availability-title">
                <div class="content-width">
                    <div class="section-heading">
                        <h2 id="availability-title">시간대별 빈 구장</h2>
                        <p>각 시간에 바로 이용 가능한 구장입니다.</p>
                    </div>
                    <div class="availability" id="availability"></div>
                </div>
            </section>
            <section class="tile tile-parchment" aria-labelledby="field-title">
                <div class="content-width">
                    <div class="section-heading">
                        <h2 id="field-title">구장별 예약 정보</h2>
                        <p>빈 시간과 예약된 팀 정보를 함께 확인하세요.</p>
                    </div>
                    <div class="field-grid" id="field-grid"></div>
                </div>
            </section>
        </div>
    </main>

    <div class="history-backdrop" id="history-backdrop" hidden></div>
    <aside class="history-menu" id="history-menu" aria-labelledby="history-menu-title" hidden>
        <div class="history-menu-header">
            <h2 id="history-menu-title">날짜 선택</h2>
            <button class="close-button" id="close-menu-button" type="button" aria-label="날짜 메뉴 닫기">닫기</button>
        </div>
        <p>저장된 예약 현황이 있는 날짜를 선택하세요.</p>
        <input class="date-picker" id="date-picker" type="date" aria-label="날짜 선택">
        <div class="date-list" id="date-list"></div>
    </aside>

    <footer><div class="content-width">고양시 축구장 예약 현황</div></footer>

    <script>
        const message = document.getElementById('message');
        const content = document.getElementById('content');
        const refreshButton = document.getElementById('refresh-button');
        const menuButton = document.getElementById('menu-button');
        const closeMenuButton = document.getElementById('close-menu-button');
        const historyMenu = document.getElementById('history-menu');
        const historyBackdrop = document.getElementById('history-backdrop');
        const datePicker = document.getElementById('date-picker');
        const dateList = document.getElementById('date-list');
        let isLoading = false;
        let currentData = null;
        let selectedDate = null;
        let availableDates = new Map();
        const fieldCardByName = new Map();

        function formatDateTime(value) {
            if (!value) return '수집 시각 없음';
            return new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit'
            }).format(new Date(value));
        }

        function setStatus(text, type = 'normal') {
            const element = document.getElementById('status');
            element.textContent = text;
            element.className = `status ${type === 'normal' ? '' : type}`;
        }

        function addTextElement(parent, className, text) {
            const element = document.createElement('div');
            element.className = className;
            element.textContent = text;
            parent.appendChild(element);
        }

        function addEntry(parent, left, right) {
            const entry = document.createElement('div');
            entry.className = 'entry';
            const label = document.createElement('span');
            label.textContent = left;
            const value = document.createElement('span');
            value.className = 'entry-time';
            value.textContent = right;
            entry.append(label, value);
            parent.appendChild(entry);
        }

        function getCurrentKstHour() {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Seoul', hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(new Date());
            return Number(parts.find((part) => part.type === 'hour').value);
        }

        function getCurrentKstDate() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const getPart = (type) => parts.find((part) => part.type === type).value;
            return `${getPart('year')}-${getPart('month')}-${getPart('day')}`;
        }

        function openMenu() {
            historyMenu.hidden = false;
            historyBackdrop.hidden = false;
            menuButton.setAttribute('aria-expanded', 'true');
            window.setTimeout(() => datePicker.focus(), 0);
        }

        function closeMenu() {
            historyMenu.hidden = true;
            historyBackdrop.hidden = true;
            menuButton.setAttribute('aria-expanded', 'false');
            menuButton.focus();
        }

        function renderAvailableDates(dates) {
            availableDates = new Map(dates.map((item) => [item.date, item]));
            dateList.replaceChildren();
            const todayButton = document.createElement('button');
            todayButton.className = `date-button ${selectedDate === null ? 'selected' : ''}`;
            todayButton.type = 'button';
            todayButton.textContent = '오늘 보기';
            todayButton.addEventListener('click', () => selectDate(null));
            dateList.appendChild(todayButton);

            if (!dates.length) {
                addTextElement(dateList, 'no-history', '저장된 날짜 데이터가 없습니다.');
                return;
            }
            dates.forEach((item) => {
                const button = document.createElement('button');
                button.className = `date-button ${selectedDate === item.date ? 'selected' : ''}`;
                button.type = 'button';
                button.textContent = `${item.date} · 마지막 수집 ${formatDateTime(item.fetched_at)}`;
                button.addEventListener('click', () => selectDate(item.date));
                dateList.appendChild(button);
            });
        }

        async function loadAvailableDates() {
            try {
                const response = await fetch('/available-dates');
                if (!response.ok) throw new Error('날짜 목록을 불러올 수 없습니다.');
                renderAvailableDates((await response.json()).dates);
            } catch (error) {
                dateList.replaceChildren();
                addTextElement(dateList, 'no-history', '날짜 목록을 불러오지 못했습니다.');
            }
        }

        function selectDate(date) {
            selectedDate = date;
            datePicker.value = date || getCurrentKstDate();
            closeMenu();
            loadData(true);
        }

        function scrollToField(fieldName) {
            const fieldCard = fieldCardByName.get(fieldName);
            if (!fieldCard) return;
            fieldCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            window.setTimeout(() => fieldCard.focus({ preventScroll: true }), 450);
        }

        function focusCurrentTime() {
            const currentRow = document.querySelector('.availability-row.current-time');
            if (!currentRow) return;
            currentRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            window.setTimeout(() => currentRow.focus({ preventScroll: true }), 450);
        }

        function renderAvailability(fields) {
            const container = document.getElementById('availability');
            container.replaceChildren();
            const currentHour = getCurrentKstHour();
            for (let hour = 7; hour < 23; hour += 1) {
                const available = Object.entries(fields)
                    .filter(([, field]) => field.empty_slots.some((slot) => {
                        const start = Number(slot.start_time.slice(0, 2));
                        const end = Number(slot.end_time.slice(0, 2));
                        return start <= hour && end > hour;
                    }))
                    .map(([name]) => name);
                const row = document.createElement('div');
                row.className = 'availability-row';
                row.tabIndex = -1;
                if (hour === currentHour) row.classList.add('current-time');
                addTextElement(row, 'availability-time', `${String(hour).padStart(2, '0')}:00 - ${String(hour + 1).padStart(2, '0')}:00`);
                if (hour === currentHour) addTextElement(row, 'current-label', '현재 시간대');
                const names = document.createElement('div');
                names.className = 'availability-fields';
                if (available.length) {
                    available.forEach((fieldName) => {
                        const link = document.createElement('button');
                        link.className = 'field-link';
                        link.type = 'button';
                        link.textContent = fieldName;
                        link.addEventListener('click', () => scrollToField(fieldName));
                        names.appendChild(link);
                    });
                } else {
                    names.textContent = '예약 가능한 구장 없음';
                }
                row.appendChild(names);
                container.appendChild(row);
            }
        }

        function createSection(title) {
            const section = document.createElement('div');
            section.className = 'section';
            addTextElement(section, 'section-title', title);
            return section;
        }

        function renderFields(fields) {
            const grid = document.getElementById('field-grid');
            grid.replaceChildren();
            fieldCardByName.clear();
            Object.entries(fields).forEach(([name, field]) => {
                const card = document.createElement('article');
                card.className = 'field-card';
                card.tabIndex = -1;
                fieldCardByName.set(name, card);
                const title = document.createElement('h3');
                title.textContent = name;

                const emptySection = createSection('빈 시간');
                if (field.empty_slots.length) {
                    field.empty_slots.forEach((slot) => addEntry(emptySection, '이용 가능', `${slot.start_time} - ${slot.end_time}`));
                } else {
                    addTextElement(emptySection, 'empty', '빈 시간이 없습니다.');
                }

                const bookedSection = createSection('예약');
                if (field.booked_matches.length) {
                    field.booked_matches.forEach((match) => addEntry(bookedSection, match.team_name, `${match.start_time} - ${match.end_time}`));
                } else {
                    addTextElement(bookedSection, 'empty', '예약이 없습니다.');
                }
                card.append(title, emptySection, bookedSection);
                grid.appendChild(card);
            });
        }

        function render(data, shouldFocusCurrentTime) {
            currentData = data;
            const metadata = data.metadata;
            document.getElementById('date-info').textContent = `${data.date} ${data.weekday}요일 기준`;
            document.getElementById('hero-summary').textContent = `${Object.keys(data.fields).length}개 구장의 최신 예약 정보를 표시합니다.`;
            document.getElementById('updated-at').textContent = `마지막 수집 ${formatDateTime(metadata.fetched_at)}`;
            document.getElementById('next-refresh').textContent = metadata.next_refresh_at ? `다음 확인 예정 ${formatDateTime(metadata.next_refresh_at)}` : '';
            setStatus(metadata.is_stale ? '이전 수집 데이터 표시 중' : '최신 수집 데이터', metadata.is_stale ? 'warning' : 'normal');
            renderAvailability(data.fields);
            renderFields(data.fields);
            message.hidden = true;
            content.hidden = false;
            if (shouldFocusCurrentTime) window.setTimeout(focusCurrentTime, 50);
        }

        async function loadData(showPending = true) {
            if (isLoading) return;
            isLoading = true;
            refreshButton.disabled = true;
            if (showPending && content.hidden) message.textContent = '저장된 예약 정보를 불러오는 중입니다.';
            try {
                const url = selectedDate ? `/schedule?date=${encodeURIComponent(selectedDate)}` : '/today';
                const response = await fetch(url);
                if (!response.ok) throw new Error('데이터 준비 중');
                const data = await response.json();
                const shouldFocusCurrentTime = content.hidden && data.date === getCurrentKstDate();
                render(data, shouldFocusCurrentTime);
                loadAvailableDates();
            } catch (error) {
                if (content.hidden) {
                    message.hidden = false;
                    message.textContent = '수집된 데이터가 아직 없습니다. 잠시 후 다시 확인해 주세요.';
                }
                setStatus('데이터 확인 대기 중', 'warning');
            } finally {
                isLoading = false;
                refreshButton.disabled = false;
            }
        }

        refreshButton.addEventListener('click', () => loadData(false));
        menuButton.addEventListener('click', openMenu);
        closeMenuButton.addEventListener('click', closeMenu);
        historyBackdrop.addEventListener('click', closeMenu);
        datePicker.addEventListener('change', () => {
            if (availableDates.has(datePicker.value)) selectDate(datePicker.value);
            else setStatus('저장된 데이터가 없는 날짜입니다.', 'warning');
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !historyMenu.hidden) closeMenu();
        });
        loadData();
        loadAvailableDates();
        window.setInterval(() => loadData(false), 60000);
        window.setInterval(() => {
            if (currentData) renderAvailability(currentData.fields);
        }, 60000);
    </script>
</body>
</html>
