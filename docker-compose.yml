services:
  soccer-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - DATABASE_PATH=/app/data/schedules.db
      - HISTORY_PATH=/app/data/history
      - REFRESH_MIN_SECONDS=2700
      - REFRESH_MAX_SECONDS=5400
    volumes:
      - schedule-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['data_available']\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  schedule-data:
